# Manual sentinel overrides for the rapamycin topic.
#
# These take effect AFTER the auto-judge ladder + include-contract demotion
# (Sprint 7.8) in the orchestrator. Use sparingly: the human reviewer is
# overriding the deterministic merge, so every override must be defensible
# by the verbatim evidence_quote in this file.

[[resolutions]]
doi = "10.1038/nature08221"
pmid = "19587680"
decision = "include"
reason = """
Foundational primary mouse rapamycin lifespan study (NIA-ITP). The
auto-judge intermittently fails to read this paper because NCBI's PMC
service returns a reCAPTCHA challenge under concurrent load, and the
publisher Unpaywall URL (Nature) is paywalled-OA. The paper itself is
unambiguously eligible per pre-specified PICO; manual override is the
correct path until a stable OA mirror is wired.
"""
evidence_quote = """
Here we report that rapamycin, an inhibitor of the mTOR pathway, extends median and maximal lifespan of both male and female mice when fed beginning at 600 days of age. On the basis of age at 90% mortality, rapamycin led to an increase of 14% for females and 9% for males.
"""
reviewer = "human-dom"

[[resolutions]]
