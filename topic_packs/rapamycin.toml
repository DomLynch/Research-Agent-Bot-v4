# --- methods honesty rewrites ---------------------------------------------
# agent/methods_honesty.py applies these substitutions to the manuscript
# body so the writer's borrowed-from-template overclaim verbs match what
# the pipeline actually performed. The right-hand side acknowledges
# automation + flags planned (pre-publication) work explicitly. Universal:
# adding a new topic = declaring its own rewrite table.
#
# Replacement runs longest-source-first so overlapping shorter phrases do
# not clobber longer ones.
[methods_honesty_rewrites]
"The present systematic review and meta-analysis is designed to provide a more granular mapping of this heterogeneity." = "The present living evidence-contract synthesis is designed to provide a more granular mapping of this heterogeneity; the current iteration reports a [STRICT_A_CORE_COUNT]-study wild-type strict A-core corpus, of which [K_POOLABLE] yield inverse-variance-poolable median-lifespan effects (pooled log_median_ratio = [POOL_ESTIMATE], 95% CI [[POOL_CI_LOW], [POOL_CI_HIGH]], back-transformed median ratio = [POOL_RATIO_BACK], [POOL_PERCENT_EXT] extension; CI overlaps null at k=[K_POOLABLE]), plus [B_LANE_COUNT:record] in the B genotype-modified sensitivity lane."
"The analysis will employ mixed-effects meta-regression models to partition variance in the standardized mean difference (SMD) of lifespan extension between studies." = "Mixed-effects meta-regression to partition SMD variance is a designed-for capability of the pipeline; an inverse-variance point estimate is reported at k>=2, while moderator meta-regression / leave-one-out / Egger's test follow the field convention of k>=5-10 contract-passing effects per metric family and are deferred until that threshold is met."
"Extraction will be performed with independent dual extraction; disagreements will be resolved by consensus or, if necessary, by consulting a third party." = "Extraction is performed by a single automated pass over parsed full text under the universal evidence contract; every extraction (study_id, metric, treated/control values, n, evidence quotes, model, timestamps) is filed in `effect_extractions.json`. Independent dual extraction and third-party adjudication are planned for the pre-publication step."
"Risk of bias for each included animal-intervention study will be assessed using the SYRCLE risk-of-bias tool [CIT:hooijmans-2014-syrcle|method-citation]. Domains include sequence generation, baseline characteristics, allocation concealment, random housing, blinding of caregivers and outcome assessors, incomplete outcome data, and selective outcome reporting. Each domain will be rated as low, high, or unclear risk of bias. Disagreements in assessment will be resolved through discussion." = "Risk of bias for each included animal-intervention study is captured automatically by the universal evidence contract (parsed-text adequacy, char-count floor, ≥2 non-title evidence quotes, endpoint coverage, intervention/control coverage); a full per-domain SYRCLE adjudication [CIT:hooijmans-2014-syrcle|method-citation] over sequence generation, baseline characteristics, allocation concealment, random housing, blinding, incomplete outcome data, and selective outcome reporting is planned for the pre-publication step."
"The statistical synthesis will employ a multi-level random-effects meta-regression model. The model will include random intercepts for study-ID and outcome-measure-within-study to account for dependency. Fixed-effects terms will include the pre-specified moderators. The restricted maximum likelihood (REML) estimator will be used for between-study variance, with the Hartung-Knapp adjustment for confidence intervals to address potential small-sample bias [CIT:hartung-knapp|method-citation]. The analysis will be conducted in R using the metafor package [CIT:viechtbauer-2010-metafor|method-citation]. Heterogeneity will be quantified using the I² statistic and prediction intervals [CIT:higgins-2003-i2|method-citation]." = "The pipeline implements an inverse-variance random-effects pool over contract-passing effects within a single metric family; an inverse-variance point estimate is reported at k>=2. The full multi-level random-effects meta-regression (random intercepts for study-ID and outcome-measure-within-study, REML between-study variance, Hartung-Knapp adjustment [CIT:hartung-knapp|method-citation], metafor in R [CIT:viechtbauer-2010-metafor|method-citation], I² and prediction intervals [CIT:higgins-2003-i2|method-citation]) requires substantially larger k — the field convention is typically k>=5-10 contract-passing effects per metric family before moderator inference is interpretable — and is deferred until that threshold is met."
"Sensitivity analyses will include leave-one-out analysis, influence diagnostics (e.g., Cook's distance), and the inspection of funnel plots for asymmetry, with Egger's regression test to formally assess publication bias [CIT:egger-1997-funnel|method-citation]." = "Sensitivity analyses (leave-one-out, influence diagnostics including Cook's distance, funnel-plot inspection for asymmetry, and Egger's regression test for publication bias [CIT:egger-1997-funnel|method-citation]) require a larger pool than the inverse-variance point estimate alone; the field convention is typically k>=5-10 contract-passing effects per metric family before these diagnostics are interpretable. The current iteration reports the inverse-variance point estimate but defers leave-one-out / influence / funnel / Egger until additional contract-passing effects accrue."
"Fok et al. (2023)" = "Fok et al. (2014)"
"the rapamycin-specific evidence through 2023" = "the rapamycin-specific evidence"
"Tyshkovskiy and colleagues" = "Ivimey-Cook and colleagues"
# --- Title reframe: honest "living evidence-contract synthesis" framing
# replaces the "systematic synthesis" claim that k=1 can't carry.
"# Systematic Synthesis of Rapamycin Effects on Murine Lifespan Across Preclinical Variables" = "# A Living Evidence-Contract Synthesis of Rapamycin Effects on Murine Lifespan: Pilot Corpus, Extraction Audit, and Evidence Gaps"
# --- Fok 2014 prose: it's a primary lifespan study, not a meta-analysis
# update. Bibliography now points at the real PLoS One 2014 paper; the
# prose follows. NOTE source phrase must match the ORIGINAL raw body
# ("(2023)") — the [N]/(year) substitution upstream is bypassed because
# methods_honesty_rewrites runs against the writer's untransformed prose.
"More recently, Fok et al. (2023) updated this synthesis, incorporating newer data and performing exploratory moderator analyses on variables like genetic background and sex" = "Fok et al. (2014) contributed a primary mouse lifespan study under rapamycin with companion liver-transcriptome profiling, expanding the empirical base examined under heterogeneous-stock conditions"
