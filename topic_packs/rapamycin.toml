"the pooled effect derived from that pool is reported under [PACKET:primary_effect]" = "the inverse-variance-pooled A-core extracted effect (k=[K_POOLABLE] contract-passing studies: [POOL_EFFECT_IDS]; the remaining A-core records — [SKIPPED_IDS] — are retained in the corpus but not yet poolable (parse_failed / off-modal-metric / no_numerics); per-study extracted values in the Study Characteristics Table + Supplementary §S5/S5b) is reported under (Supplementary §S5/S5b; Appendix A) — pooled log_median_ratio = [POOL_ESTIMATE] (95% CI [[POOL_CI_LOW], [POOL_CI_HIGH]]; back-transformed median ratio = [POOL_RATIO_BACK]) — with the [B_LANE_COUNT:record] from the genotype-modified / disease-model sensitivity lane ([B_LANE_IDS]) carried separately"
"The current synthesis provides a pooled estimate of rapamycin and sirolimus effects on mouse lifespan based on the k studies specified in [PACKET:primary_effect]" = "The current synthesis provides [POOL_EFFECT_COUNT:effect] from the A-core contract-passing inverse-variance pool ([POOL_EFFECT_IDS]; per-study extracted values in Supplementary §S5/S5b + Appendix A) — pooled log_median_ratio = [POOL_ESTIMATE] (95% CI [[POOL_CI_LOW], [POOL_CI_HIGH]]), back-transformed median ratio = [POOL_RATIO_BACK] ([POOL_PERCENT_EXT] extension; CI overlaps null at k=[K_POOLABLE]) — plus [B_LANE_COUNT:record] in the B genotype-modified / disease-model sensitivity lane ([B_LANE_IDS])"
# --- Rewrite the stale Results sentence that hard-codes k_studies=1 /
# k_effects=1 / 0.388 with the k=2 A-core pool and the s246 sensitivity.
"The single-study extracted effect (log_median_ratio) was 0.388 (95% CI -0.032 to 0.808; back-transformed ratio 1.474; k_studies=1, k_effects=1) [PACKET:primary_effect]." = "The inverse-variance-pooled A-core effect (k=[K_POOLABLE] contract-passing studies: [POOL_EFFECT_IDS]; remaining A-core records [SKIPPED_IDS] are retained in the corpus but not yet poolable — parse_failed / off-modal-metric / no_numerics; per-study extracted values in the Study Characteristics Table) is log_median_ratio = [POOL_ESTIMATE] (95% CI [[POOL_CI_LOW], [POOL_CI_HIGH]]; back-transformed median ratio = [POOL_RATIO_BACK], [POOL_PERCENT_EXT] median lifespan extension; CI overlaps 1.0 at k=[K_POOLABLE]). The B sensitivity lane carries [B_LANE_COUNT:record] ([B_LANE_IDS], genotype-modified / disease-model) separately so the wild-type headline estimate is not driven by genotype-modified survival (Supplementary §S5/S5b; Appendix A)."
# --- Update the moderator-not-estimable paragraph: k=2 IS the current
# state, but k=2 still doesn't support proper moderator inference.
"fewer than two contract-passing effects accrued within any single metric family, so no inferential machinery beyond the inverse-variance point estimate can be honestly reported" = "only k=2 contract-passing effects accrued within the A-core median-lifespan family, well below the threshold needed for moderator meta-regression / leave-one-out / Egger's test (typical minimum k>=5-10), so no inferential machinery beyond the two-study inverse-variance point estimate can be honestly reported"
# --- Results: collapse 4 RESULTS_BLOCKED subsections into one honest
# "not estimable" paragraph so the manuscript no longer promises
