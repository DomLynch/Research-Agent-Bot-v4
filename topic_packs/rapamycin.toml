# --- prose placeholders ----------------------------------------------------
# Values substituted into the manuscript by agent/placeholder_resolver.py
# for every [PLACEHOLDER:<key>] marker. The three pipeline-derived counts
# ([N_SCREENED], [N_ACCEPTED], [K_STUDIES]) come from receipts, not this
# table. Universal: a new topic declares its own [placeholders] block;
# the resolver is topic-agnostic.
[placeholders]
"databases" = "PubMed, OpenAlex, Europe PMC, Crossref, Unpaywall, Semantic Scholar, CORE, OSF Preprints, bioRxiv/medRxiv, ClinicalTrials.gov, and the Researka internal canonical index (16 sources aggregated per the universal retrieval contract)"
"date-range" = "January 2001 (post-Easter-Island rapamycin era) through April 2026 (final retrieval cycle)"
"query-terms" = "(rapamycin OR sirolimus) AND (lifespan OR survival OR longevity OR mortality) AND (mouse OR mice OR \"Mus musculus\"); full Boolean syntax filed in supplement S1"
"minimum-studies-per-cell" = "k < 3 studies per moderator cell"

# --- methods honesty rewrites ---------------------------------------------
# agent/methods_honesty.py applies these substitutions to the manuscript
# body so the writer's borrowed-from-template overclaim verbs match what
# the pipeline actually performed. The right-hand side acknowledges
# automation + flags planned (pre-publication) work explicitly. Universal:
# adding a new topic = declaring its own rewrite table.
#
# Replacement runs longest-source-first so overlapping shorter phrases do
# not clobber longer ones.
[methods_honesty_rewrites]
"The present systematic review and meta-analysis is designed to provide a more granular mapping of this heterogeneity." = "The present living evidence-contract synthesis is designed to provide a more granular mapping of this heterogeneity once the contract-passing pool accrues k>=2 effects per metric family; the current iteration reports a four-study strict A-core corpus and a single inverse-variance-poolable median-lifespan effect."
"The analysis will employ mixed-effects meta-regression models to partition variance in the standardized mean difference (SMD) of lifespan extension between studies." = "Mixed-effects meta-regression to partition SMD variance is a designed-for capability of the pipeline; it is reported only once k>=2 contract-passing effects per metric family accrue."
"Extraction will be performed with independent dual extraction; disagreements will be resolved by consensus or, if necessary, by consulting a third party." = "Extraction is performed by a single automated pass over parsed full text under the universal evidence contract; every extraction (study_id, metric, treated/control values, n, evidence quotes, model, timestamps) is filed in `effect_extractions.json`. Independent dual extraction and third-party adjudication are planned for the pre-publication step."
"Risk of bias for each included animal-intervention study will be assessed using the SYRCLE risk-of-bias tool [14]. Domains include sequence generation, baseline characteristics, allocation concealment, random housing, blinding of caregivers and outcome assessors, incomplete outcome data, and selective outcome reporting. Each domain will be rated as low, high, or unclear risk of bias. Disagreements in assessment will be resolved through discussion." = "Risk of bias for each included animal-intervention study is captured automatically by the universal evidence contract (parsed-text adequacy, char-count floor, ≥2 non-title evidence quotes, endpoint coverage, intervention/control coverage); a full per-domain SYRCLE adjudication [14] over sequence generation, baseline characteristics, allocation concealment, random housing, blinding, incomplete outcome data, and selective outcome reporting is planned for the pre-publication step."
"The statistical synthesis will employ a multi-level random-effects meta-regression model. The model will include random intercepts for study-ID and outcome-measure-within-study to account for dependency. Fixed-effects terms will include the pre-specified moderators. The restricted maximum likelihood (REML) estimator will be used for between-study variance, with the Hartung-Knapp adjustment for confidence intervals to address potential small-sample bias [17]. The analysis will be conducted in R using the metafor package [12]. Heterogeneity will be quantified using the I² statistic and prediction intervals [18]." = "The pipeline implements an inverse-variance random-effects pool over contract-passing effects within a single metric family; the multi-level random-effects meta-regression (random intercepts for study-ID and outcome-measure-within-study, REML between-study variance, Hartung-Knapp adjustment [17], metafor in R [12], I² and prediction intervals [18]) is the designed-for analysis that is reported once k>=2 contract-passing effects accrue per metric family."
"Sensitivity analyses will include leave-one-out analysis, influence diagnostics (e.g., Cook's distance), and the inspection of funnel plots for asymmetry, with Egger's regression test to formally assess publication bias [19]." = "Sensitivity analyses (leave-one-out, influence diagnostics including Cook's distance, funnel-plot inspection for asymmetry, and Egger's regression test for publication bias [19]) are planned once k>=2 contract-passing effects accrue; the current iteration reports only the inverse-variance point estimate with its analytical confidence interval."
"Fok et al. (2023)" = "Fok et al. (2014)"
"the rapamycin-specific evidence through 2023" = "the rapamycin-specific evidence"
"Tyshkovskiy and colleagues" = "Ivimey-Cook and colleagues"
