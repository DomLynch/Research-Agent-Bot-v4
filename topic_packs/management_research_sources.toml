[source_policy]
primary_sources = ["openalex", "crossref", "semantic_scholar", "ssrn", "jstor", "repec"]
preferred_journals = ["academy_of_management_journal", "organization_science", "management_science", "journal_of_applied_psychology"]
exclude_if_only = ["leadership_blog", "consulting_benchmark", "vendor_survey", "single_company_anecdote"]

[evidence_artifacts]
required_fields = [
    "population", "organization_type", "industry", "geography", "time_period",
    "intervention", "comparator", "outcome", "metric", "study_design",
    "dataset", "estimation_method", "identification_strategy", "effect_size",
    "sample_size",
]
