# Topic pack: metformin (biguanide) lifespan synthesis.
# Topic-agnostic schema — every field is read by agent/topic_pack.py.
# Sibling pack to rapamycin.toml: same mouse-lifespan system + endpoint,
# different intervention vocabulary. Used to verify that all of agent/
# is truly pack-driven (no biomedical literals leak from core code).

topic = "metformin"
display_name = "Metformin"

[scope]
primary_system = "mouse"
preferred_terms = ["murine", "mouse", "mice"]
discouraged_terms = ["mammalian", "vertebrate", "rodent", "rat", "rats"]
endpoint = "lifespan"
# Primary intervention names that count toward the pooled lifespan corpus.
# Older biguanides (buformin, phenformin) are retained for translational
# context but MUST NOT enter the primary pooled-effect analysis — phenformin
# was withdrawn for lactic-acidosis, buformin has different pharmacology.
primary_interventions = ["metformin"]
translational_only_interventions = ["buformin", "phenformin", "biguanide", "biguanides"]

[cite_roles]
default = "literature-reference"
allowed = [
    "primary-study",
    "prior-meta-analysis",
    "narrative-review",
    "systematic-review",
    "mechanism-review",
    "clinical-trial",
    "protocol-registration",
    "method-citation",
    "literature-reference",
]

# --- anchor citations ------------------------------------------------------
# Known prior metformin-lifespan work and their canonical roles.
[anchors]
"anisimov-2011-metformin"            = "primary-study"
"martin-montalvo-2013-metformin"     = "primary-study"
"strong-2016-itp-acarbose-met"       = "primary-study"
"alfaras-2017-metformin"             = "primary-study"
"chen-2022-metformin-meta"           = "prior-meta-analysis"
"ivimey-cook-tyshkovskiy-2025-meta"  = "prior-meta-analysis"
"barzilai-tame-2016-review"          = "narrative-review"
"foretz-viollet-2014-mechanism"      = "mechanism-review"
"madiraju-2014-metformin-mechanism"  = "mechanism-review"
"crowley-2017-metformin-clinical"    = "clinical-trial"
"page-2020-prisma"                   = "method-citation"
"hooijmans-2014-syrcle"              = "method-citation"
"percie-du-sert-2020-arrive"         = "method-citation"
"schunemann-grade"                   = "method-citation"
"egger-1997-funnel"                  = "method-citation"
"viechtbauer-2010-metafor"           = "method-citation"
"higgins-2003-i2"                    = "method-citation"
"hartung-knapp"                      = "method-citation"

[length_caps]
abstract = 300
introduction = 1000
methods = 1200

[retrieval]
sources = [
    "pubmed",
    "crossref",
    "openalex",
    "europepmc",
    "semantic_scholar",
    "core",
    "biorxiv",
    "osf",
    "ctgov",
    "researka",
]

[density]
min_words_per_citation = 45

[empirical_triggers]
outcome_nouns_extra   = ["lifespan", "survival", "longevity", "mortality",
                         "burden", "incidence", "prevalence", "hazard",
                         "extension"]
direction_verbs_extra = ["extends", "extend", "prolongs", "prolong",
                         "attenuates", "attenuate", "abolishes", "abolish"]
subjects_extra        = ["mice", "animals"]

[extraction]
preferred_metric_families = [
    "median_lifespan",
    "median_survival",
    "median_lifespan_days",
    "median_lifespan_months",
]

[eligibility]
endpoint_terms       = ["lifespan", "survival", "longevity", "mortality",
                        "median survival", "maximum lifespan", "kaplan-meier",
                        "log-rank"]
control_terms        = ["control", "vehicle", "placebo", "untreated",
                        "wild-type", "wild type"]
exclude_design_terms = ["systematic review", "meta-analysis",
                        "narrative review", "scoping review",
                        "in vitro", "cell line", "cell culture",
                        "case report", "editorial", "commentary"]
combination_terms    = ["combined with", "combination with", "plus ",
                        "co-treatment", "co-administered"]
min_text_chars       = 2000

[sentinel_recall]
# Each DOI verified against PubMed. Canonical metformin mouse-lifespan
# studies the retrieval pipeline must surface (or document as unavailable).
primary = [
    "10.1038/ncomms3192",          # Martin-Montalvo 2013, Nature Communications — metformin extends lifespan in mice
    "10.1111/acel.12496",          # Strong 2016, Aging Cell — ITP cohort with acarbose / 17a-estradiol / metformin
    "10.1111/acel.12880",          # Alfaras 2017, Aging Cell - low-dose metformin lifespan
]
prior_meta = [
    "10.1111/acel.70131",          # Ivimey-Cook & Tyshkovskiy 2025, Aging Cell - vertebrate meta (metformin null vs rapamycin positive)
]

[strict_a_core]
non_mouse_species_terms = [
    "c. elegans", "caenorhabditis", "drosophila", "fruit fly", "d. melanogaster",
    "saccharomyces", "yeast",
    "marmoset", "rhesus", "primate", "monkey",
    "human subjects", "human patients", "clinical trial",
    "zebrafish",
]
secondary_design_quote_markers = [
    "proteomic", "transcriptomic", "metabolomic", "lipidomic",
    "methylation", "methylome", "epigenetic",
    "dirac", "atlas", "signature", "biomarker",
    "fatty acid pattern", "fatty-acid pattern",
]
genotype_modified_strain_markers = [
    "knockout", "transgenic", "deficient", "-deficient",
    "homozygous deletion", "−/−", "-/-",
    "tg(",
]

