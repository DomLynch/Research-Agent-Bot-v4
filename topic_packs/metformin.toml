# --- prose placeholders ----------------------------------------------------
[placeholders]
"databases" = "PubMed (NCBI E-utilities), Crossref, OpenAlex, Europe PMC, Semantic Scholar, CORE, bioRxiv/medRxiv (via the Europe PMC preprint filter), OSF Preprints, ClinicalTrials.gov, and the Researka internal canonical index — 10 search sources aggregated in parallel under the universal retrieval contract; Unpaywall serves as the DOI -> open-access URL resolver"
"date-range" = "January 2005 (post-Anisimov metformin-aging convergence) through May 2026 (final retrieval cycle)"
"query-terms" = "Boolean composition metformin AND (lifespan OR survival OR longevity OR mortality) AND (mouse OR mice OR \"Mus musculus\"); full Boolean syntax filed in supplement S1"
"minimum-studies-per-cell" = "k < 3 studies per moderator cell"
"MODERATOR_P:intervention" = "intervention identity"
"MODERATOR_P:dose" = "dose level"
"MODERATOR_P:sex" = "biological sex"
"MODERATOR_P:genetic_background" = "genetic background"
"MODERATOR_P:treatment_initiation_age" = "age at treatment initiation"

# --- methods honesty rewrites ---------------------------------------------
# Universal rewrites first (target topic-agnostic strings). Topic-specific
# corrective rewrites can be added iteratively after observing what the
# writer drafts for metformin.
[methods_honesty_rewrites]
# Universal corpus-prose tokens (work on any topic whose receipts use the
# project's standard schema).
"after strict A-core auditing, 4 records remain eligible for primary-effect extraction" = "after strict A-core auditing, [STRICT_A_CORE_COUNT] records remain eligible for primary-effect extraction ([STRICT_A_CORE_IDS]; [K_POOLABLE] currently yield inverse-variance-poolable numerics)"
"sample-size recovery was incomplete for certain studies (e.g., s230, s235), preventing inverse-variance weighting for those records" = "sample-size or metric recovery remains incomplete for [INCOMPLETE_RECOVERY_IDS], preventing inverse-variance weighting for those records"
# Strip [PACKET:...] audit anchors from manuscript prose.
"[PACKET:study_selection]" = "(Supplementary §S2-S3; Appendix A)"
"[PACKET:corpus_characteristics]" = "(Supplementary §S4; Appendix A)"
"[PACKET:primary_effect]" = "(Supplementary §S5/S5b; Appendix A)"
"[PACKET:primary_pool_composition]" = "(Supplementary §S4 and §S8; Appendix A)"
"[PACKET:sentinel_recall]" = "(Supplementary §S7; Appendix A)"

# --- back-matter prose ----------------------------------------------------
[back_matter]
ethics_statement = """This synthesis re-analyses published animal-research data. No new experiments on living animals were conducted. The included primary studies are responsible for their own institutional animal-care and ethical approvals; reviewers are referred to the primary references in this manuscript for those statements. The synthesis itself does not require additional ethical approval."""
conflicts_statement = """The operator declares no financial conflicts of interest related to metformin or biguanide pharmacology, geroprotective interventions, or the cited primary studies. The pipeline is open-source and reusable across topics; no commercial relationship influenced the eligibility rules or the manuscript framing for the present synthesis."""
