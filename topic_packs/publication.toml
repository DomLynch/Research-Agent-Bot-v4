[publication]
author = "Dom Lynch"
orcid = ""
venue = "ReseaRka Evidence Index"
license = "CC BY-NC 4.0"
version = "1.0"
canonical_url_base = ""

[alpha_memo]
min_source_papers = 5
min_direct_source_papers = 5
# Cite a homogeneous cluster of >= this many sources. Researka intake rejects
# bundles under 5 citations ("minimum_citations" gate), and the editorial panel
# rejects bundles that are not homogeneous — so the publishable unit is 5+
# sources that all share one population/comparator/endpoint, not a padded mix.
min_cluster_source_papers = 5
# Hold evidence-map submissions until Researka's reviewer panel accepts the type
# (it currently rejects them as "a list of findings, not a synthesis"). Maps
# still render and stay ready; flip to true when the platform reviewer lands.
submit_evidence_maps = false
refresh_cooldown_hours = 2
refresh_top = 5
angle_candidates = 5
min_angle_score = 45
published_topic_cooldown_days = 1
decision_poll_attempts = 30
decision_poll_seconds = 10
