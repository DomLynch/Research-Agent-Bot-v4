[publication]
author = "Dom Lynch"
orcid = ""
venue = "ReseaRka Evidence Index"
license = "CC BY-NC 4.0"
version = "1.0"
canonical_url_base = ""

[alpha_memo]
min_source_papers = 5
min_direct_source_papers = 5
# Cite a homogeneous cluster of >= this many distinct sources. A narrow alpha
# memo's publishable unit is 2-4 sources that all share one population/
# comparator/endpoint — Researka intake grants a 2-4 source exception to a
# TIER_1/L5 memo with no active blockers, and its editorial panel rejects padded
# 5-source mixes. "3 strong homogeneous sources beat 5 mixed ones": never pad to
# reach a count. (5+ homogeneous still publishes via the regular citation floor.)
min_cluster_source_papers = 3
# Evidence maps publish: Researka's panel accepts them as landscape syntheses
# (verified 2026-06-12, multi_agent_systems_show accepted "elite-tier"). A map
# needs >= evidence_map_min_citations cited sources to clear the intake floor;
# sub-floor maps are held rather than burning an intake reject.
submit_evidence_maps = true
evidence_map_min_citations = 10
# Operator control for the single-claim lane. Single-claim memos currently
# reach editorial but often reject on synthesis quality (thesis is a raw receipt
# concatenation; falsifier is boilerplate — the synthesized-abstract work). They
# still SUBMIT by default because an editorial reject is safe (it never arms the
# 3-intake-reject backoff) and the lane is the main publishing path. Flip to
# false to hold the lane (e.g. to stop reject records) until the synthesis pass
# lands — maps keep publishing meanwhile.
submit_single_claim_alpha = true
refresh_cooldown_hours = 2
refresh_top = 5
angle_candidates = 5
min_angle_score = 45
published_topic_cooldown_days = 1
decision_poll_attempts = 30
decision_poll_seconds = 10
source_literature_scan_limit = 10

[alpha_memo.domains.longevity]
min_source_papers = 5
min_direct_source_papers = 5
source_literature_scan_limit = 10

