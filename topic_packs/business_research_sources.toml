[source_policy]
primary_sources = ["openalex", "crossref", "semantic_scholar", "ssrn", "nber", "repec"]
preferred_journals = ["strategic_management_journal", "management_science", "organization_science", "journal_of_operations_management"]
exclude_if_only = ["consulting_report", "vendor_claim", "press_release", "case_study_without_counterfactual"]

[evidence_artifacts]
required_fields = [
    "population", "organization_type", "industry", "geography", "time_period",
    "intervention", "comparator", "outcome", "metric", "study_design",
    "dataset", "estimation_method", "identification_strategy", "effect_size",
    "sample_size",
]
