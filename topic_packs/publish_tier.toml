[publish_tier]
# Universal English cue words for thesis tension. Domain vocabulary belongs in
# topic packs or source data, not runtime code.
tension_markers = [
  "backfire",
  "contradict",
  "contrast",
  "counter",
  "discrepancy",
  "paradox",
  "tradeoff",
  "tension",
  "threshold",
  "whereas",
]

counter_markers = [
  "did not",
  "failed",
  "lack",
  "no ",
  "not ",
  "null",
  "unchanged",
  "without",
]

generic_tokens = [
  "analysis",
  "association",
  "based",
  "clinical",
  "cohort",
  "context",
  "effect",
  "evidence",
  "factor",
  "finding",
  "health",
  "human",
  "model",
  "outcome",
  "paper",
  "research",
  "risk",
  "study",
  "system",
  "therapy",
  "treatment",
]

cluster_stopwords = [
  "and",
  "are",
  "for",
  "from",
  "into",
  "that",
  "the",
  "this",
  "with",
]

[thresholds]
ready_min_bound_receipts = 3
ready_min_a_core_receipts = 2
ready_min_alpha_score = 70
review_min_alpha_score = 30
source_concentration_share = 0.60
domain_overlap_min = 0.06
context_min_available_sources = 3
broad_d_bad_share = 0.60
broad_min_sources = 3

[feed_scope]
# Product-scope markers for the current ReseaRka longevity feed. These are
# data-level routing hints: another industry feed should replace this section,
# while agent/publish_tier.py stays unchanged.
off_scope_markers = [
  "agriculture",
  "crop",
  "cultivar",
  "grain",
  "oryza",
  "plant",
  "rice",
  "seed",
]
