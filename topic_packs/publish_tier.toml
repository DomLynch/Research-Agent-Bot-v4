[thresholds]
ready_min_bound_receipts = 3
ready_min_a_core_receipts = 2
ready_min_alpha_score = 70
review_min_alpha_score = 30
source_concentration_share = 0.60
domain_overlap_min = 0.06
context_min_available_sources = 3
broad_d_bad_share = 0.60
broad_min_sources = 3

[feed_scope]
# Product-scope markers for the current ReseaRka longevity feed. These are
# data-level routing hints: another industry feed should replace this section,
# while agent/publish_tier.py stays unchanged.
off_scope_markers = [
  "agriculture",
  "crop",
  "cultivar",
  "grain",
  "oryza",
  "plant",
  "rice",
  "seed",
]

[novelty]
# P9 Novelty Engine — deterministic "is this NEW vs prior art, and do the cited
# sources exist?" gate. Rollout (AAA blast-fence):
#   off      = dormant; no novelty.json produced, publish decision unchanged.
#   advisory = shadow: produce novelty.json + record blockers, do NOT block.
#   enforce  = insufficient_novelty / citation_hallucinated become hard blockers.
# Env var NOVELTY_GATE overrides this. Default off so merging changes nothing
# in the live pipeline until explicitly enabled.
mode = "off"
saturation_count = 40        # corpus prior-art sources at/above which scarcity -> 0
weight_scarcity = 0.5
weight_distinctiveness = 0.3
weight_recency = 0.2
min_score = 45               # score below this -> insufficient_novelty
recency_window_years = 3
recency_decay_years = 12
